name: Deploy Fork to Balena
on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    # Redeploy daily so fleets pick up the next published latest-${board} images.
    - cron: "23 10 * * *"

concurrency:
  group: balena-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  balena_cloud_build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: pi3
            fleet: it71/anthias-pi3
          - board: pi5
            fleet: it71/anthias-pi5

    name: Deploy to ${{ matrix.fleet }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Balena CLI
        run: npm install -g balena-cli

      - name: Authenticate and deploy via Anthias script
        run: |
          balena login --token ${{ secrets.BALENA_TOKEN }}
          chmod +x ./bin/deploy_to_balena.sh
          ./bin/deploy_to_balena.sh --board ${{ matrix.board }} --fleet ${{ matrix.fleet }}
